[package]
name = "notane-retail-pos"
version = "1.5.1"
description = "Sistem POS Retail Enterprise"
edition = "2021"
default-run = "notane-retail-pos"

[lib]
name = "notane_retail_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "notane-retail-pos"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-opener = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["serde", "v4"] }

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

