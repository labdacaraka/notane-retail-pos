[package]
name = "notane-manager"
version = "1.5.4"
description = "Notane License & Server Management Studio"
edition = "2021"
default-run = "notane-manager"

[lib]
name = "notane_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "notane-manager"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-build"]

[dependencies]
tauri = { version = "2.2.0", features = [], optional = true }
tauri-plugin-opener = { version = "2.2.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "any", "uuid", "chrono", "json", "migrate"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
rand = "0.8"
ed25519-dalek = "3.0.0"
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"
dirs = "7.0.0"
local-ip-address = "0.6"
validator = { version = "0.18", features = ["derive"] }
thiserror = "2.0"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [], optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

