[package]
name = "notane-retail-server"
version = "1.0.0"
description = "Sistem Server Notane Retail Host Engine"
edition = "2021"
default-run = "notane-retail-server"

[lib]
name = "notane_retail_server_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "notane-retail-server"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-build"]

[dependencies]
tauri = { version = "2.2.0", features = [], optional = true }
tauri-plugin-opener = { version = "2.2.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde", "db-postgres"] }
argon2 = "0.5"
jsonwebtoken = "9.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
rand = "0.8"
futures = "0.3"
futures-util = "0.3"
postgresql_embedded = "0.21.0"
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"
reqwest = { version = "0.13.5", features = ["json"] }
local-ip-address = "0.6"
rust_xlsxwriter = "0.101.0"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [], optional = true }
